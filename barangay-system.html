<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resident Portal - Barangay Resident Information System</title>
<style>
  :root {
    --bg: #eef3f1;
    --card: #ffffff;
    --ink: #17302a;
    --muted: #5d7770;
    --line: #cfdcd7;
    --brand: #0f6b57;
    --brand-dark: #0a4d3f;
    --error: #b3261e;
    --ok: #0f6b57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tabs button {
    flex: 1; padding: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); border-radius: 8px;
    font-size: .95rem; cursor: pointer;
  }
  .tabs button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  label { display: block; font-size: .88rem; margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 1rem; font-family: inherit;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid #86c9b8; outline-offset: 1px;
  }
  .submit {
    width: 100%; margin-top: 20px; padding: 12px; border: 0;
    background: var(--brand); color: #fff; border-radius: 8px;
    font-size: 1rem; cursor: pointer;
  }
  .submit:hover { background: var(--brand-dark); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 14px; font-size: .9rem; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none; }
  .welcome p { margin: 6px 0; }
  .link { background: none; border: 0; color: var(--brand); cursor: pointer; padding: 0; font-size: .9rem; text-decoration: underline; }
</style>
</head>
<body>

<div class="box">

  <!-- LOGIN / REGISTER -->
  <div id="authView">
    <h1>Resident Portal</h1>
    <p class="sub">Mag-register o mag-log in para makapag-request.</p>

    <div class="tabs">
      <button id="tabLogin" class="active" type="button">Log in</button>
      <button id="tabRegister" type="button">Register</button>
    </div>

    <!-- Login -->
    <div id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
      <button id="loginBtn" class="submit" type="button">Log in</button>
      <p style="margin:12px 0 0"><button id="forgotBtn" class="link" type="button">Nakalimutan ang password?</button></p>
    </div>

    <!-- Register -->
    <div id="registerForm" class="hidden">
      <label for="regFirst">First name</label>
      <input id="regFirst" type="text" autocomplete="given-name">
      <label for="regLast">Last name</label>
      <input id="regLast" type="text" autocomplete="family-name">
      <label for="regPhone">Mobile number</label>
      <input id="regPhone" type="tel" autocomplete="tel" placeholder="09XXXXXXXXX">
      <label for="regAddress">Address (House No. / Street)</label>
      <input id="regAddress" type="text" autocomplete="street-address">
      <label for="regEmail">Email</label>
      <input id="regEmail" type="email" autocomplete="email">
      <label for="regPassword">Password (6 o higit pang characters)</label>
      <input id="regPassword" type="password" autocomplete="new-password">
      <label for="regPassword2">Ulitin ang password</label>
      <input id="regPassword2" type="password" autocomplete="new-password">
      <button id="registerBtn" class="submit" type="button">Create account</button>
    </div>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </div>

  <!-- AFTER LOGIN -->
  <div id="homeView" class="hidden welcome">
    <h1 id="welcomeName">Welcome!</h1>
    <p class="sub">Naka-log in ka na.</p>
    <p id="welcomeEmail"></p>
    <p id="welcomeAddress"></p>
    <button id="logoutBtn" class="submit" type="button">Log out</button>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // Import the functions you need from the SDKs you need

// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBuGSvWeiQmgbG6vHt1QQou-c43c1t926g",
  authDomain: "barangay-system-83389.firebaseapp.com",
  projectId: "barangay-system-83389",
  storageBucket: "barangay-system-83389.firebasestorage.app",
  messagingSenderId: "707377538631",
  appId: "1:707377538631:web:4fe59889fb0e91cec53362"
};

// Initialize Firebase

  };
  // ===========================================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const msg = $("msg");

  function show(text, type) {
    msg.textContent = text;
    msg.className = "msg " + (type || "");
  }

  function friendlyError(err) {
    switch (err.code) {
      case "auth/email-already-in-use": return "May account na gamit ang email na ito.";
      case "auth/invalid-email": return "Hindi tama ang format ng email.";
      case "auth/weak-password": return "Masyadong mahina ang password. Gumamit ng 6 o higit pang characters.";
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found": return "Mali ang email o password.";
      case "auth/too-many-requests": return "Masyadong maraming subok. Subukan ulit mamaya.";
      case "auth/network-request-failed": return "Walang internet. I-check ang connection.";
      case "permission-denied": return "Walang permission. I-check ang Firestore Security Rules.";
      default: return "May error: " + (err.code || err.message);
    }
  }

  // Tabs
  function showTab(which) {
    const isLogin = which === "login";
    $("loginForm").classList.toggle("hidden", !isLogin);
    $("registerForm").classList.toggle("hidden", isLogin);
    $("tabLogin").classList.toggle("active", isLogin);
    $("tabRegister").classList.toggle("active", !isLogin);
    show("");
  }
  $("tabLogin").addEventListener("click", () => showTab("login"));
  $("tabRegister").addEventListener("click", () => showTab("register"));

  // Register
  $("registerBtn").addEventListener("click", async () => {
    const first = $("regFirst").value.trim();
    const last = $("regLast").value.trim();
    const phone = $("regPhone").value.trim();
    const address = $("regAddress").value.trim();
    const email = $("regEmail").value.trim();
    const pw = $("regPassword").value;
    const pw2 = $("regPassword2").value;

    if (!first || !last || !phone || !address || !email || !pw) {
      return show("Punan ang lahat ng fields.", "error");
    }
    if (pw !== pw2) return show("Hindi magkapareho ang password.", "error");

    const btn = $("registerBtn");
    btn.disabled = true;
    show("Ginagawa ang account...");
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      // Ang role ay laging "resident" dito. Hindi dapat mapalitan ng user (tingnan ang Security Rules).
      await setDoc(doc(db, "users", cred.user.uid), {
        firstName: first,
        lastName: last,
        phone: phone,
        address: address,
        email: email,
        role: "resident",
        createdAt: serverTimestamp()
      });
      show("Tagumpay! Naka-log in ka na.", "ok");
    } catch (err) {
      show(friendlyError(err), "error");
    } finally {
      btn.disabled = false;
    }
  });

  // Login
  $("loginBtn").addEventListener("click", async () => {
    const email = $("loginEmail").value.trim();
    const pw = $("loginPassword").value;
    if (!email || !pw) return show("Ilagay ang email at password.", "error");

    const btn = $("loginBtn");
    btn.disabled = true;
    show("Nilo-log in...");
    try {
      await signInWithEmailAndPassword(auth, email, pw);
      show("");
    } catch (err) {
      show(friendlyError(err), "error");
    } finally {
      btn.disabled = false;
    }
  });

  // Forgot password
  $("forgotBtn").addEventListener("click", async () => {
    const email = $("loginEmail").value.trim();
    if (!email) return show("Ilagay muna ang email, tapos pindutin ulit.", "error");
    try {
      await sendPasswordResetEmail(auth, email);
      show("Nagpadala kami ng reset link sa email mo.", "ok");
    } catch (err) {
      show(friendlyError(err), "error");
    }
  });

  // Logout
  $("logoutBtn").addEventListener("click", () => signOut(auth));

  // Auto-detect kung naka-log in
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      $("authView").classList.add("hidden");
      $("homeView").classList.remove("hidden");
      $("welcomeEmail").textContent = "Email: " + user.email;
      $("welcomeName").textContent = "Welcome!";
      $("welcomeAddress").textContent = "";
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          const d = snap.data();
          $("welcomeName").textContent = "Welcome, " + d.firstName + "!";
          $("welcomeAddress").textContent = "Address: " + d.address;
        }
      } catch (err) {
        // Hindi nabasa ang profile. Naka-log in pa rin.
      }
    } else {
      $("homeView").classList.add("hidden");
      $("authView").classList.remove("hidden");
    }
  });
</script>
</body>
</html>
